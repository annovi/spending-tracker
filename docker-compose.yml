version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: spending-tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spending_tracker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spending_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
